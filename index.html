<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lista Regali di Nina</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">

  <style>
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: -1;
      background-color: #fcecf0;
      /* INCOLLA IL TUO BASE64 ESATTAMENTE TRA LE DUE VIRGOLETTE QUI SOTTO */
      background-image: url("INSERISCI_QUI_IL_TUO_CODICE_BASE64_CHE_INIZIA_PER_data:image/jpeg;base64,");
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
    }
  </style>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="top-spacer"></header>
    
    <div id="admin-panel" class="admin-panel">
      <!-- Inserimento singolo -->
      <div class="admin-single-add">
        <input type="text" id="new-gift-input" placeholder="Nome nuovo regalo (es. Libricino)...">
        <input type="url" id="new-gift-link" placeholder="Link per l'acquisto (opzionale)...">
        <button id="add-gift-btn">Aggiungi</button>
      </div>

      <!-- Importazione di massa -->
      <button id="toggle-import-btn" class="secondary-btn">⬇️ Importa lista veloce</button>
      <div id="import-area" class="import-area" style="display: none;">
        <p class="import-hint">Incolla qui la tua lista (un regalo per riga). Se hai un link, mettilo accanto al nome (il sistema lo capirà da solo!).</p>
        <textarea id="import-text" rows="5" placeholder="Es:&#10;Bavaglini&#10;Tutina https://sito.it/tutina"></textarea>
        <button id="confirm-import-btn">Salva tutti in lista</button>
      </div>
    </div>

    <ul id="gift-list" class="gift-list"></ul>
  </div>

  <button id="print-btn" class="print-btn" aria-label="Salva o Stampa PDF">🖨️ Stampa PDF</button>
  <button id="admin-btn" class="admin-btn">⚙️ Modifica</button>

  <script src="app.js"></script>
</body>
</html>
